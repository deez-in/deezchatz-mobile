name: Deploy to Play Store Internal Testing

on:
  release:
    types: [published]

  # Allow manual trigger for testing the workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build AAB & Deploy to Internal Track
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Production AAB locally
        run: eas build --platform android --profile production --local --non-interactive --output ./deezchatz.aab

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: in.deez.chatz
          releaseFiles: ./deezchatz.aab
          track: internal

      - name: Rename AAB with version
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp deezchatz.aab "deezchatz-${VERSION}.aab"

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deezchatz-aab
          path: deezchatz-*.aab
          retention-days: 30

      - name: Attach AAB to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: deezchatz-*.aab
