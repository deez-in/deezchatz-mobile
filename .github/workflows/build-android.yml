name: Build & Deploy Android

on:
  release:
    types: [published]

  # Allow manual trigger for testing the workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: APK
            profile: production-apk
            ext: apk
          - target: AAB
            profile: production
            ext: aab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Signed ${{ matrix.target }} locally
        run: eas build --platform android --profile ${{ matrix.profile }} --local --non-interactive --output ./deezchatz.${{ matrix.ext }}

      - name: Rename artifact with version
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp deezchatz.${{ matrix.ext }} "deezchatz-${VERSION}.${{ matrix.ext }}"

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.ext }}
          path: deezchatz-*.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy & Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-artifact-*
          merge-multiple: true

      # - name: Upload to Google Play Internal Testing
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      #     packageName: in.deez.chatz
      #     releaseFiles: artifacts/deezchatz-*.aab
      #     track: internal

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/deezchatz-*.apk
            artifacts/deezchatz-*.aab
